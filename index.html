<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>દિવાળી શુભકામના – ટેક રુત્વિક મિસ્ત્રી</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta+Vaani:wght@500;800&family=Hind+Vadodara:wght@400;500;600&family=Cinzel:wght@700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{--night:#1b0b2e;--plum:#3b1250;--gold:#ffb627;--cream:#fff4d6;--rani:#c2185b}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;color:var(--cream);font-family:'Hind Vadodara',sans-serif;
 background:radial-gradient(ellipse at 50% 105%,#6a1b5e 0,var(--plum) 35%,var(--night) 78%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---------- 3D gift box gate ---------- */
#gate{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;
 transition:opacity 1s ease,transform 1s ease}
#gate.out{opacity:0;transform:scale(1.8);pointer-events:none}
.zoom{perspective:900px;width:200px;height:130px;margin-top:40px}
.scene{width:200px;height:130px;position:relative;transform-style:preserve-3d;cursor:pointer;outline:none;
 animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.scene:focus-visible .front{outline:3px solid #fff}
@keyframes sway{0%,100%{transform:rotateX(-20deg) rotateY(-30deg) translateY(0)}50%{transform:rotateX(-16deg) rotateY(30deg) translateY(-12px)}}
.f{position:absolute;display:grid;place-items:center;border:2px solid #ffcf5c;
 background:linear-gradient(135deg,#c2185b,#6d1040)}
.rib{background:linear-gradient(90deg,transparent 42%,#ffd56a 42%,#ffd56a 58%,transparent 58%),linear-gradient(135deg,#c2185b,#6d1040)}
.front,.back,.left,.right{width:200px;height:130px}
.front{transform:translateZ(100px)}
.back{transform:rotateY(180deg) translateZ(100px)}
.left{transform:rotateY(-90deg) translateZ(100px)}
.right{transform:rotateY(90deg) translateZ(100px)}
.bottom{width:200px;height:200px;top:-35px;transform:rotateX(-90deg) translateZ(65px);background:#3a0a22}
.lid{position:absolute;left:0;top:0;width:200px;height:0;transform-style:preserve-3d;transform-origin:50% 0 -100px;
 transition:transform 1.1s cubic-bezier(.3,1.35,.5,1)}
.scene.open .lid{transform:rotateX(120deg)}
.lt{left:0;top:-100px;width:200px;height:200px;transform:rotateX(90deg)}
.ls{height:34px;top:0;width:204px;left:-2px}
.lf{transform:translateZ(102px)}
.lb{transform:rotateY(180deg) translateZ(102px)}
.ll{transform:rotateY(-90deg) translateZ(102px)}
.lr{transform:rotateY(90deg) translateZ(102px)}
.tag{font:700 30px/1 'Cinzel',serif;letter-spacing:.12em;color:var(--gold);background:#2a0f3d;
 border:2px solid var(--gold);border-radius:6px;padding:10px 16px 10px 22px;box-shadow:0 0 22px rgba(255,182,39,.55);
 animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 38px rgba(255,182,39,.95);transform:scale(1.06)}}
.beam{position:absolute;left:50%;top:0;width:280px;height:340px;margin-left:-140px;transform:translateY(-100%);opacity:0;
 background:linear-gradient(to top,rgba(255,214,110,.95),rgba(255,214,110,0));clip-path:polygon(28% 100%,72% 100%,100% 0,0 0)}
.scene.open .beam{opacity:1;transition:opacity .7s .35s}
.hint{text-align:center;font-size:19px;line-height:1.7;color:var(--cream)}
.hint b{display:block;font:800 22px 'Mukta Vaani',sans-serif;color:var(--gold)}
.hint span{opacity:.8;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}

/* ---------- greeting ---------- */
#main{position:fixed;inset:0;z-index:3;display:grid;place-items:center;padding:0 0 90px;perspective:1000px;opacity:0;pointer-events:none;transition:opacity 1.4s}
#main.show{opacity:1}
.card{width:min(90vw,560px);padding:clamp(26px,6vw,48px) clamp(20px,5vw,40px);text-align:center;border-radius:28px;
 background:linear-gradient(145deg,rgba(42,14,62,.66),rgba(70,20,80,.5));border:1px solid rgba(255,182,39,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 transform-style:preserve-3d;
 box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 50px rgba(255,182,39,.12)}
.r{opacity:0;transform:translateY(16px) translateZ(40px);transition:opacity 1s,transform 1s}
#main.show .r{opacity:1;transform:translateY(0) translateZ(40px);transition-delay:calc(var(--i)*.9s + .5s)}
h1{font:800 clamp(36px,10vw,62px)/1.3 'Mukta Vaani',sans-serif;color:var(--gold);text-shadow:0 0 30px rgba(255,160,30,.65),0 4px 0 #9a4a00;margin-bottom:18px}
.rule{width:120px;height:2px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card p{font-size:clamp(18px,4.8vw,22px);font-weight:500;line-height:1.8;margin-bottom:14px}
.card p,.sig small{text-shadow:0 2px 10px rgba(0,0,0,.95),0 0 22px rgba(0,0,0,.8)}
.sig{text-shadow:0 2px 10px rgba(0,0,0,.9);margin-top:26px;font:800 clamp(22px,6vw,28px)/1.4 'Mukta Vaani',sans-serif;color:var(--gold)}
.sig small{display:block;font:400 15px 'Hind Vadodara',sans-serif;color:var(--cream);opacity:.75;font-style:italic;margin-top:2px}
.sig{display:flex;align-items:center;justify-content:center;gap:16px;text-align:left}
.pp{width:clamp(86px,24vw,112px);aspect-ratio:7/9;object-fit:cover;border-radius:8px;border:2px solid var(--gold);
 box-shadow:0 10px 26px rgba(0,0,0,.5),0 0 20px rgba(255,182,39,.35)}
.who{display:flex;flex-direction:column;border-left:2px solid rgba(255,182,39,.55);padding-left:16px}
.tap{position:fixed;left:0;right:0;bottom:62px;text-align:center;font-size:15px;opacity:0;z-index:3;transition:opacity 1s 6s}
#main.show~.tap{opacity:.7}

/* ---------- diyas ---------- */
.diyas{position:fixed;left:0;right:0;bottom:10px;z-index:4;display:flex;justify-content:space-around;pointer-events:none}
.diya{position:relative;width:46px;height:44px}
.bowl{position:absolute;bottom:0;width:100%;height:20px;border-radius:0 0 46px 46px/0 0 20px 20px;
 background:linear-gradient(#e0842a,#8a3a0c);box-shadow:0 0 20px rgba(255,150,40,.6)}
.flame{position:absolute;bottom:18px;left:50%;width:12px;height:26px;margin-left:-6px;border-radius:50%/60% 60% 40% 40%;
 background:radial-gradient(ellipse at 50% 70%,#fff7c2,#ffb627 55%,#ff5a1a);box-shadow:0 0 24px 9px rgba(255,170,40,.55);
 transform-origin:50% 100%;animation:flick .2s infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.14) rotate(3deg)}}

#mute{position:fixed;top:max(14px,env(safe-area-inset-top));right:14px;z-index:10;font:500 15px 'Hind Vadodara',sans-serif;
 color:var(--cream);background:rgba(27,11,46,.6);border:1px solid rgba(255,182,39,.55);border-radius:99px;padding:8px 16px;cursor:pointer;display:none}
#mute:focus-visible{outline:2px solid #fff}
@media(prefers-reduced-motion:reduce){.scene{animation:none;transform:rotateX(-18deg) rotateY(-20deg)}.flame,.tag,.hint span{animation:none}}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<button id="mute" type="button">🔊 અવાજ ચાલુ</button>

<div id="gate">
  <div class="zoom" id="zoom">
    <div class="scene" id="scene" tabindex="0" role="button" aria-label="Open">
      <div class="beam"></div>
      <div class="f bottom"></div>
      <div class="f left"></div>
      <div class="f right"></div>
      <div class="f back rib"></div>
      <div class="f front rib"><span class="tag">Open</span></div>
      <div class="lid">
        <div class="f lt rib"></div>
        <div class="f ls lf rib"></div>
        <div class="f ls lb rib"></div>
        <div class="f ls ll"></div>
        <div class="f ls lr"></div>
      </div>
    </div>
  </div>
  <p class="hint"><b>તમારા માટે એક ખાસ ભેટ</b><span>બોક્સ પર ટેપ કરો</span></p>
</div>

<div id="main">
  <div class="card" id="card">
    <h1 class="r" style="--i:0">શુભ દીપાવલી</h1>
    <div class="rule r" style="--i:1"></div>
    <p class="r" style="--i:2">ટેક રુત્વિક મિસ્ત્રી તરફથી તમને દિવાળીની હાર્દિક શુભકામનાઓ.</p>
    <p class="r" style="--i:3">તમારા પરિવારમાં સુખ અને સમૃદ્ધિ બની રહે તેવી શુભેચ્છા.</p>
    <p class="r" style="--i:4">દીવાના પ્રકાશની જેમ તમારું જીવન સદા ઉજ્જવળ રહે.</p>

<p class="tap">સ્ક્રીન પર ટેપ કરો અને ફટાકડા ફોડો</p>
<div class="diyas" id="diyas"></div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
document.fonts&&document.fonts.load("800 40px 'Mukta Vaani'",'શુભ દીપાવલી');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- Audio (all synthesised, no files needed) ---------- */
let AC,master,fx,noiseBuf,muted=false,step=0,mt;
const N=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,784];
const P=[0,2,4,2,3,1,2,0,4,5,7,5,4,3,2,1];
function audioInit(){
  if(AC){AC.resume();return}
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
  fx=AC.createDelay(1);fx.delayTime.value=.3;
  const fb=AC.createGain();fb.gain.value=.38;fx.connect(fb);fb.connect(fx);fx.connect(master);
  const len=AC.sampleRate*1.5;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
}
function bell(f,t=0,v=.18){
  if(!AC)return;const s=AC.currentTime+t,g=AC.createGain();
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+2.2);
  g.connect(master);g.connect(fx);
  [[1,1],[2.76,.35],[5.4,.12]].forEach(([m,a])=>{
    const o=AC.createOscillator(),x=AC.createGain();o.frequency.value=f*m;x.gain.value=a;
    o.connect(x);x.connect(g);o.start(s);o.stop(s+2.3);
  });
}
function noise(t,dur,type,f0,f1,v){
  const s=AC.currentTime+t,src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  src.buffer=noiseBuf;fl.type=type;fl.frequency.setValueAtTime(f0,s);fl.frequency.exponentialRampToValueAtTime(f1,s+dur);
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+dur);
  src.connect(fl);fl.connect(g);g.connect(master);src.start(s,Math.random()*.5);src.stop(s+dur);
}
function thump(t=0,v=.6){
  const s=AC.currentTime+t,o=AC.createOscillator(),g=AC.createGain();
  o.frequency.setValueAtTime(140,s);o.frequency.exponentialRampToValueAtTime(40,s+.35);
  g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+.4);
  o.connect(g);g.connect(master);o.start(s);o.stop(s+.45);
}
const sfx={
  launch(){if(AC)noise(0,.7,'bandpass',500,3000,.12)},
  boom(){if(!AC)return;thump(0,.45);noise(0,.9,'lowpass',2500,200,.3);
    for(let i=0;i<6;i++)noise(.1+Math.random()*.6,.05,'highpass',3000,3500,.1)},
  open(){if(!AC)return;[0,2,4,5,7,8].forEach((n,i)=>bell(N[n],i*.12,.2));thump(0,.7);noise(0,1.2,'bandpass',300,4000,.1)}
};
function music(){
  if(!AC||mt)return;
  const dr=AC.createGain(),lp=AC.createBiquadFilter();dr.gain.value=.05;lp.type='lowpass';lp.frequency.value=500;
  dr.connect(lp);lp.connect(master);
  [130.81,196,196.8,261.63].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(dr);o.start()});
  mt=setInterval(()=>{
    if(document.hidden)return;
    const n=P[step%P.length];bell(N[n],0,.12);
    if(step%8===0)bell(N[n]/2,0,.1);
    if(step%4===0)thump(0,.16);
    step++;
  },460);
}
$('mute').onclick=()=>{
  muted=!muted;
  if(master)master.gain.setTargetAtTime(muted?0:.8,AC.currentTime,.05);
  $('mute').textContent=muted?'🔇 અવાજ બંધ':'🔊 અવાજ ચાલુ';
};

/* ---------- Fireworks ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  $('zoom').style.transform='scale('+Math.min(1,innerWidth/430)+')'}
addEventListener('resize',rs);rs();
const rockets=[],parts=[];
const cols=[[255,182,39],[255,122,26],[224,48,122],[255,244,214],[120,220,255],[170,255,120]];
function launch(x,y){
  rockets.push({sx:x+rnd(-70,70),x:0,y:H,tx:x,ty:y,p:0});sfx.launch();
}
function explode(x,y){
  sfx.boom();
  const c=cols[Math.floor(Math.random()*cols.length)],c2=cols[Math.floor(Math.random()*cols.length)],ring=Math.random()<.35;
  for(let i=0;i<80;i++){
    const a=Math.random()*Math.PI*2,sp=ring?4.2:rnd(1.2,5.5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:rnd(.009,.019),c:i%3?c:c2});
  }
}
let running=false,next=0,rx=0,ry=0,tx=0,ty=0,lastPtr=-1e9;
function loop(t){
  cx.globalCompositeOperation='destination-out';cx.fillStyle='rgba(0,0,0,.22)';cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation='lighter';
  if(running&&t>next){launch(rnd(W*.12,W*.88),rnd(H*.1,H*.45));next=t+rnd(700,1600)}
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];r.p+=.022;const e=1-Math.pow(1-r.p,2);
    r.x=r.sx+(r.tx-r.sx)*e;r.y=H+(r.ty-H)*e;
    cx.fillStyle='rgba(255,230,160,.95)';cx.beginPath();cx.arc(r.x,r.y,2.2,0,7);cx.fill();
    if(r.p>=1){explode(r.tx,r.ty);rockets.splice(i,1)}
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.vx*=.985;p.vy=p.vy*.985+.045;p.x+=p.vx;p.y+=p.vy;p.l-=p.d;
    if(p.l<=0){parts.splice(i,1);continue}
    cx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+p.l+')';
    cx.beginPath();cx.arc(p.x,p.y,1.1+p.l*1.7,0,7);cx.fill();
  }
  // 3D tilt of the greeting card
  let gx,gy;
  if(t-lastPtr>2500&&!reduce){gy=Math.sin(t/1800)*7;gx=Math.cos(t/2300)*4}else{gx=tx;gy=ty}
  rx+=(gx-rx)*.08;ry+=(gy-ry)*.08;
  $('card').style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg)';
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Diyas ---------- */
const dy=$('diyas');
for(let i=0;i<9;i++){
  dy.insertAdjacentHTML('beforeend','<div class="diya"><div class="bowl"></div><div class="flame" style="animation-duration:'+rnd(.14,.3).toFixed(2)+'s;animation-delay:-'+rnd(0,.3).toFixed(2)+'s"></div></div>');
}

/* ---------- Flow ---------- */
const scene=$('scene'),gate=$('gate'),main=$('main');
function openBox(){
  if(scene.classList.contains('open'))return;
  audioInit();sfx.open();scene.classList.add('open');
  setTimeout(()=>gate.classList.add('out'),1500);
  setTimeout(()=>{
    main.classList.add('show');running=true;music();$('mute').style.display='block';
    [0,450,1000].forEach(d=>setTimeout(()=>launch(rnd(W*.2,W*.8),rnd(H*.12,H*.4)),d));
  },2000);
}
scene.addEventListener('click',openBox);
scene.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBox()}});
document.addEventListener('pointerdown',e=>{
  if(running&&!e.target.closest('#mute'))launch(e.clientX,e.clientY);
});
document.addEventListener('pointermove',e=>{
  lastPtr=performance.now();
  ty=(e.clientX/W-.5)*16;tx=(e.clientY/H-.5)*-12;
});
</script>
